name: Test and deploy Skyline to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyline-aws-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BACKEND_MODE: aws
          VITE_API_URL: /api

      - name: Install isolated Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.64.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Start local demo application
        run: |
          mkdir -p artifacts
          nohup npm run dev:demo > /tmp/skyline-demo.log 2>&1 &
          echo $! > /tmp/skyline-demo.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then
              echo "Local demo is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/skyline-demo.log
          exit 1

      - name: Check browser test scripts parse
        run: |
          node --check scripts/smoke.cjs
          node --check scripts/ux-smoke.cjs
          node --check scripts/ui-coverage.cjs

      - name: Test merchandise, account, roles, and responsive smoke journeys
        run: node scripts/smoke.cjs
        env:
          PLAYWRIGHT_MODULE: playwright
          TEST_URL: http://127.0.0.1:5174

      - name: Test event interactions and public navigation
        if: always()
        run: node scripts/ux-smoke.cjs
        env:
          PLAYWRIGHT_MODULE: playwright
          TEST_URL: http://127.0.0.1:5174

      - name: Audit every visible route control, field, form, and table
        if: always()
        run: npm run test:ui
        env:
          PLAYWRIGHT_MODULE: playwright
          TEST_URL: http://127.0.0.1:5174

      - name: Upload detailed UI coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-coverage-report
          path: artifacts/ui-coverage.json
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      AWS_ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Get temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: skyline-github-${{ github.run_id }}
      - name: Deploy backend and frontend; check live health
        run: node scripts/deploy-existing.js
